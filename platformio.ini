; PlatformIO Project Configuration for Project Phuljhari ✨
; Receiver: ESP32-WROOM-32D Development Board

[platformio]
default_envs = receiver_esp32dev

[env:receiver_esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<receiver/src/*.cpp>
build_flags =
    -Ishared
    -Ireceiver/include
    -Ireceiver/src
lib_deps =
    fastled/FastLED @ ^3.6.0
