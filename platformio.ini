; PlatformIO Project Configuration for Project Phuljhari ✨
; Monorepo: M5StickS3 Controller & ESP32-WROOM-32D Receiver

[platformio]
default_envs = controller_m5sticks3, receiver_esp32dev
src_dir = .

[env:controller_m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =
    -<*>
    +<controller/src/*.cpp>
build_flags =
    -Ishared
    -Icontroller/include
    -Icontroller/src
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified @ ^0.2.13

[env:receiver_esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<receiver/src/*.cpp>
build_flags =
    -Ishared
    -Ireceiver/include
    -Ireceiver/src
lib_deps =
    fastled/FastLED @ ^3.6.0
