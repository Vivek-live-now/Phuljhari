name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-tests:
    name: Host Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run Native Test Suite
        run: |
          chmod +x test/run_tests.sh
          ./test/run_tests.sh

  firmware-build:
    name: PlatformIO Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Receiver Firmware (esp32dev)
        run: |
          pio run -e receiver_esp32dev
